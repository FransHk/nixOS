# Shared desktop behaviour: used by both the desktop and laptop hosts.
monitor = ,preferred,auto,auto

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = waybar
exec-once = nm-applet --indicator
exec-once = hyprpaper
exec-once = kitty

input {
  kb_layout = us
  follow_mouse = 1
  sensitivity = 0
  #touchpad { natural_scroll = no }
}

general {
  gaps_in = 5
  gaps_out = 10
  border_size = 2
  col.active_border = rgb(cdd6f4)
  col.inactive_border = rgba(595959aa)
  layout = dwindle
}

misc { disable_hyprland_logo = yes }
decoration {
  rounding = 5
  #blur { enabled = true; size = 7; passes = 4 }
}
animations {
  enabled = yes
  bezier = myBezier, 0.10, 0.9, 0.1, 1.05
  animation = windows, 1, 10, myBezier, slide
  animation = windowsOut, 1, 7, myBezier, slide
  animation = border, 1, 10, default
  animation = fade, 1, 7, default
  animation = workspaces, 1, 6, default
}
dwindle { preserve_split = yes }

$mainMod = SUPER

# Vim-like focus.
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# Applications and window controls.
bind = $mainMod, Q, exec, kitty
bind = $mainMod, Z, exec, wofi --show drun
bind = $mainMod, SPACE, exec, wofi --show drun
bind = $mainMod, X, exec, zeditor
bind = $mainMod, B, exec, firefox
bind = $mainMod, E, exec, thunar
bind = $mainMod, O, exec, hyprlock
bind = $mainMod, D, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod, V, togglefloating
bind = $mainMod SHIFT, M, exit
bind = $mainMod, S, exec, grim -g "$(slurp)" - | swappy -f -

# Audio works through PipeWire's PulseAudio compatibility layer.
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -10%
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +10%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Laptop-only brightness bindings — uncomment on the laptop after adding
# brightnessctl in home/fransh.nix:
# bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
# bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Workspaces.
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = ALT, TAB, focusworkspaceoncurrentmonitor, previous_per_monitor
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
