# JetBrains Mono Nerd Font provides the regular typeface and patched glyphs.
font_family JetBrainsMono Nerd Font

# Let the Hyprland wallpaper subtly show through the terminal background.
background_opacity 0.6
dynamic_background_opacity yes

# Start new OS windows at Kitty's initial size instead of restoring a previous
# maximized state.
remember_window_size no

# Close the OS window immediately without asking for confirmation.
confirm_os_window_close 0
